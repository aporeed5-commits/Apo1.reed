<body>

<header>
  <div class="gatos">🐈‍⬛ ✨ 🐈</div>
  <h1>Apo1.reed</h1>
  <p>Películas para nosotros 🍿</p>
</header>

<div class="contenedor">

  <!-- BUSCADOR -->
  <input
    id="buscador"
    name="movie-search"
    class="buscar"
    type="search"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    readonly
    onfocus="this.removeAttribute('readonly')"
    placeholder="🔎 Buscar película..."
    oninput="mostrarPeliculas()"
  >

  <div class="categorias">

    <button
      class="categoria-btn activo"

    >
      🎬 Todas
    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('mari', this)"
    >
      ❤️ Mari
    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('familia', this)"
    >
      👨‍👩‍👧 Familia
    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('terror', this)"
    >

    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('accion', this)"
    >
      💥 Acción
    </button>

  <!-- LOGIN -->

    <input

    >

    <input
      id="poster"

    >

    <input

    >

      id="anio"

    <input
      id="calidad"

    >

    <select id="categoria">

<!-- BOTÓN ADMIN -->

>
  ⚙️
</button>

<!-- REPRODUCTOR -->
<div id="modal" class="modal">

  <div class="modal-contenido">

    <button
      class="cerrar"
      onclick="cerrarVideo()"
    >
      ✕ Cerrar
    </button>

      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    ></video>

    <a
      id="abrirDropbox"
      class="abrir-dropbox"
      target="_blank"
      rel="noopener"
    >
      Abrir enlace original de Dropbox
    </a>

  </div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://jnxtndenqxgqqzmmckco.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3gyntuSUrTd999iy3dbkoQ_d-CcVBG4";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let todasLasPeliculas = [];

let categoriaActual = "todas";

let usuarioActual = null;


/* =========================
   INICIO
========================= */

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    const buscador =
      document.getElementById(
        "buscador"
      );

    buscador.value = "";

    await comprobarSesion();

    await cargarPeliculas();

  }
);


/* =========================
   SESIÓN
========================= */

async function comprobarSesion() {

  const resultado =
    await supabaseClient.auth.getSession();

  usuarioActual =
    resultado.data.session
      ? resultado.data.session.user
      : null;

  actualizarPanelAdmin();

}


async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const resultado =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (resultado.error) {

    document.getElementById(
      "mensajeLogin"
    ).textContent =
      "❌ " +
      resultado.error.message;

    return;

  }


  usuarioActual =
    resultado.data.user;


  document.getElementById(
    "mensajeLogin"
  ).textContent =
    "✅ Sesión iniciada";


  actualizarPanelAdmin();

  await cargarPeliculas();

}


async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  usuarioActual = null;

  actualizarPanelAdmin();

  alert(
    "Sesión cerrada"
  );

}


function abrirAdministracion() {

  if (usuarioActual) {

    document
      .getElementById("panelAdmin")
      .classList.toggle("visible");

  } else {

    document
      .getElementById("panelLogin")
      .classList.toggle("visible");

  }

}


function actualizarPanelAdmin() {

  const login =
    document.getElementById(
      "panelLogin"
    );

  const admin =
    document.getElementById(
      "panelAdmin"
    );


  if (usuarioActual) {

    login.classList.remove(
      "visible"
    );

    admin.classList.add(
      "visible"
    );

  } else {

    admin.classList.remove(
      "visible"
    );

  }

}


/* =========================
   PELÍCULAS
========================= */

async function cargarPeliculas() {

  const resultado =
    await supabaseClient
      .from("peliculas")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (resultado.error) {

    console.error(
      resultado.error
    );

    document.getElementById(
      "peliculas"
    ).innerHTML =
      '<div class="mensaje">❌ No se pudieron cargar las películas.</div>';

    return;

  }


  todasLasPeliculas =
    resultado.data || [];


  mostrarPeliculas();

}


function obtenerDatos(
  pelicula
) {

  try {

    if (
      pelicula.descripcion &&
      typeof pelicula.descripcion === "string"
    ) {

      return JSON.parse(
        pelicula.descripcion
      );

    }

  } catch (error) {

    console.log(
      "Descripción antigua"
    );

  }


  return {

    anio: "",

    calidad: "",

    tamano: "",

    categoria: "principal",

    texto:
      pelicula.descripcion || ""

  };

}


function cambiarCategoria(
  categoria,
  boton
) {

  categoriaActual =
    categoria;


  document
    .querySelectorAll(
      ".categoria-btn"
    )
    .forEach(
      function(btn) {

        btn.classList.remove(
          "activo"
        );

      }
    );


  boton.classList.add(
    "activo"
  );


  document.getElementById(
    "buscador"
  ).value = "";


  mostrarPeliculas();

}


function mostrarPeliculas() {

  const contenedor =
    document.getElementById(
      "peliculas"
    );


  const buscador =
    document.getElementById(
      "buscador"
    );


  let busqueda =
    (
      buscador.value || ""
    )
      .toLowerCase()
      .trim();


  if (
    busqueda.includes("@")
  ) {

    buscador.value = "";

    busqueda = "";

  }


  let peliculas =
    todasLasPeliculas.filter(
      function(pelicula) {

        const datos =
          obtenerDatos(
            pelicula
          );


        const categoria =
          datos.categoria ||
          "principal";


        const textoBusqueda = (

          (pelicula.titulo || "") +
          " " +
          (datos.texto || "") +
          " " +
          (datos.anio || "") +
          " " +
          categoria

        ).toLowerCase();


        const coincideBusqueda =
          !busqueda ||
          textoBusqueda.includes(
            busqueda
          );


        let coincideCategoria =
          true;


        if (
          categoriaActual === "mari"
        ) {

          coincideCategoria =
            pelicula.favorita_mari === true;

        } else if (
          categoriaActual !== "todas"
        ) {

          const categoriaNormalizada =
            categoria === "familiares"
              ? "familia"
              : categoria;


          coincideCategoria =
            categoriaNormalizada ===
            categoriaActual;

        }


        return (
          coincideBusqueda &&
          coincideCategoria
        );

      }
    );


  if (
    peliculas.length === 0
  ) {

    contenedor.innerHTML =
      '<div class="mensaje">🍿 No hay películas en esta sección.</div>';

    return;

  }


  contenedor.innerHTML =
    peliculas
      .map(
        function(pelicula) {

          const indice =
            todasLasPeliculas.indexOf(
              pelicula
            );


          return crearTarjeta(
            pelicula,
            indice
          );

        }
      )
      .join("");

}


function crearTarjeta(
  pelicula,
  indice
) {

  const datos =
    obtenerDatos(
      pelicula
    );


  const categoria =
    datos.categoria ||
    "principal";


  let etiquetas = "";


  if (datos.anio) {

    etiquetas +=
      `<span class="etiqueta">${datos.anio}</span>`;

  }


  if (datos.calidad) {

    etiquetas +=
      `<span class="etiqueta">${datos.calidad}</span>`;

  }


  if (datos.tamano) {

    etiquetas +=
      `<span class="etiqueta">${datos.tamano}</span>`;

  }


  if (
    categoria === "familia"
  ) {

    etiquetas +=
      `<span class="etiqueta">👨‍👩‍👧 Familia</span>`;

  }


  if (
    categoria === "terror"
  ) {

    etiquetas +=
      `<span class="etiqueta">👻 Terror</span>`;

  }


  if (
    categoria === "accion"
  ) {

    etiquetas +=
      `<span class="etiqueta">💥 Acción</span>`;

  }


  if (
    pelicula.favorita_mari === true
  ) {

    etiquetas +=
      `<span class="etiqueta favorita">❤️ Mari</span>`;

  }


  const poster =
    pelicula.poster_url ||
    "";


  const descripcion =
    datos.texto ||
    "";


  const enlaceDescarga =
    convertirDropbox(
      pelicula.videos_url ||
      "",
      true
    );


  return `

    <div class="tarjeta">

      ${
        poster
          ? `<img
              class="poster"
              src="${poster}"
              alt="${pelicula.titulo}"
            >`
          : `<div class="poster"></div>`
      }

      <div class="contenido">

        <div class="titulo">
          ${pelicula.titulo}
        </div>

        <div class="etiquetas">
          ${etiquetas}
        </div>

        <div class="descripcion">
          ${descripcion}
        </div>

        <div class="botones">

          <button
            class="btn ver"
            onclick="verPeliculaPorIndice(${indice})"
          >
            ▶️ Ver
          </button>

          <button
            class="btn tv"
            onclick="transmitirPeliculaPorIndice(${indice})"
          >
            📺 TV
          </button>

          ${
            enlaceDescarga
              ? `<a
                  class="btn descargar"
                  href="${enlaceDescarga}"
                  target="_blank"
                  rel="noopener"
                  download
                >
                  ⬇️ Descargar
                </a>`
              : ""
          }

          ${
            usuarioActual
              ? `<button
                  class="btn eliminar"
                  onclick="eliminarPelicula('${pelicula.id}')"
                >
                  🗑️
                </button>`
              : ""
          }

        </div>

      </div>

    </div>

  `;

}


/* =========================
   DROPBOX
========================= */

function convertirDropbox(
  url,
  descargar
) {

  if (!url) {

    return "";

  }


  try {

    const nuevaUrl =
      new URL(
        url.trim()
      );


    if (descargar) {

      nuevaUrl.searchParams.set(
        "dl",
        "1"
      );

      nuevaUrl.searchParams.delete(
        "raw"
      );

    } else {

      nuevaUrl.searchParams.delete(
        "dl"
      );

      nuevaUrl.searchParams.set(
        "raw",
        "1"
      );

    }


    return nuevaUrl.toString();


  } catch (error) {

    console.error(
      "Enlace Dropbox inválido:",
      error
    );

    return url.trim();

  }

}


/* =========================
   REPRODUCIR
========================= */

function verPeliculaPorIndice(
  indice
) {

  const pelicula =
    todasLasPeliculas[
      indice
    ];


  if (!pelicula) {

    return;

  }


  const enlaceOriginal =
    pelicula.videos_url ||
    "";


  if (!enlaceOriginal) {

    alert(
      "Esta película no tiene un enlace de Dropbox."
    );

    return;

  }


  const urlVideo =
    convertirDropbox(
      enlaceOriginal,
      false
    );


  const video =
    document.getElementById(
      "videoPlayer"
    );


  const modal =
    document.getElementById(
      "modal"
    );


  const enlace =
    document.getElementById(
      "abrirDropbox"
    );


  modal.classList.add(
    "visible"
  );


  video.pause();


  video.removeAttribute(
    "src"
  );


  video.load();


  video.src =
    urlVideo;


  enlace.href =
    enlaceOriginal;


  video.load();


  video.play().catch(
    function(error) {

      console.log(
        "Autoplay bloqueado:",
        error
      );

    }
  );

}


/* =========================
   CERRAR VIDEO
========================= */

function cerrarVideo() {

  const video =
    document.getElementById(
      "videoPlayer"
    );


  const modal =
    document.getElementById(
      "modal"
    );


  video.pause();


  video.removeAttribute(
    "src"
  );


  video.load();


  modal.classList.remove(
    "visible"
  );

}


/* =========================
   AGREGAR
========================= */

async function agregarPelicula() {

  if (!usuarioActual) {

    alert(
      "Debes iniciar sesión."
    );

    return;

  }


  const titulo =
    document
      .getElementById("titulo")
      .value
      .trim();


  const poster =
    document
      .getElementById("poster")
      .value
      .trim();


  const enlace =
    document
      .getElementById("enlace")
      .value
      .trim();


  const anio =
    document
      .getElementById("anio")
      .value
      .trim();


  const calidad =
    document
      .getElementById("calidad")
      .value
      .trim();


  const tamano =
    document
      .getElementById("tamano")
      .value
      .trim();


  const categoria =
    document
      .getElementById("categoria")
      .value;


  const favoritaMari =
    document
      .getElementById("favoritaMari")
      .checked;


  const descripcion =
    document
      .getElementById("descripcion")
      .value
      .trim();


  if (
    !titulo ||
    !enlace
  ) {

    alert(
      "Escribe al menos el título y el enlace de Dropbox."
    );

    return;

  }


  const datos = {

    anio: anio,

    calidad: calidad,

    tamano: tamano,

    categoria: categoria,

    texto: descripcion

  };


  const resultado =
    await supabaseClient
      .from("peliculas")
      .insert({

        titulo:
          titulo,

        descripcion:
          JSON.stringify(
            datos
          ),

        poster_url:
          poster,

        videos_url:
          enlace,

        favorita_mari:
          favoritaMari

      });


  if (resultado.error) {

    console.error(
      resultado.error
    );


    document.getElementById(
      "mensajeAdmin"
    ).textContent =
      "❌ " +
      resultado.error.message;


    return;

  }


  document.getElementById(
    "mensajeAdmin"
  ).textContent =
    "✅ Película agregada";


  document.getElementById(
    "titulo"
  ).value = "";


  document.getElementById(
    "poster"
  ).value = "";


  document.getElementById(
    "enlace"
  ).value = "";


  document.getElementById(
    "anio"
  ).value = "";


  document.getElementById(
    "calidad"
  ).value = "";


  document.getElementById(
    "tamano"
  ).value = "";


  document.getElementById(
    "descripcion"
  ).value = "";


  document.getElementById(
    "favoritaMari"
  ).checked = false;


  await cargarPeliculas();

}


/* =========================
   ELIMINAR
========================= */

async function eliminarPelicula(
  id
) {

  if (!usuarioActual) {

    alert(
      "Debes iniciar sesión."
    );

    return;

  }


  const confirmar =
    confirm(
      "¿Quieres eliminar esta película?"
    );


  if (!confirmar) {

    return;

  }


  const resultado =
    await supabaseClient
      .from("peliculas")
      .delete()
      .eq(
        "id",
        id
      );


  if (resultado.error) {

    alert(
      "❌ " +
      resultado.error.message
    );

    return;

  }


  await cargarPeliculas();

}


/* =========================
   GOOGLE CAST / TV
========================= */

async function transmitirPeliculaPorIndice(
  indice
) {

  const pelicula =
    todasLasPeliculas[
      indice
    ];


  if (!pelicula) {

    return;

  }


  const enlaceOriginal =
    pelicula.videos_url ||
    "";


  if (!enlaceOriginal) {

    alert(
      "Esta película no tiene un enlace de Dropbox."
    );

    return;

  }


  if (
    typeof cast === "undefined" ||
    !cast.framework ||
    !cast.framework.CastContext
  ) {

    alert(
      "Google Cast no está disponible en este navegador."
    );

    return;

  }


  try {

    const castContext =
      cast.framework.CastContext.getInstance();


    let castSession =
      castContext.getCurrentSession();


    if (!castSession) {

      await castContext.requestSession();

      castSession =
        castContext.getCurrentSession();

    }


    if (!castSession) {

      alert(
        "No se pudo conectar con la pantalla."
      );

      return;

    }


    const urlVideo =
      convertirDropbox(
        enlaceOriginal,
        false
      );


    const mediaInfo =
      new chrome.cast.media.MediaInfo(
        urlVideo,
        "video/mp4"
      );


    mediaInfo.metadata =
      new chrome.cast.media.GenericMediaMetadata();


    mediaInfo.metadata.title =
      pelicula.titulo ||
      "Película";


    if (pelicula.poster_url) {

      mediaInfo.metadata.images = [
        {
          url:
            pelicula.poster_url
        }
      ];

    }


    const request =
      new chrome.cast.media.LoadRequest(
        mediaInfo
      );


    request.autoplay =
      true;


    await castSession.loadMedia(
      request
    );


    console.log(
      "Película enviada a la TV:",
      pelicula.titulo
    );


  } catch (error) {

    console.error(
      "Error al transmitir:",
      error
    );


    alert(
      "No se pudo transmitir la película a la pantalla."
    );

  }

}
