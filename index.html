<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://jnxtndenqxgqqzmmckco.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3gyntuSUrTd999iy3dbkoQ_d-CcVBG4";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let todasLasPeliculas = [];
let categoriaActual = "todas";
let usuarioActual = null;


/* =========================
   INICIO
========================= */

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    const buscador =
      document.getElementById("buscador");

    buscador.value = "";

    await comprobarSesion();
    await cargarPeliculas();

    const ipGuardada =
      localStorage.getItem("lg_webos_tv_ip");

    if (ipGuardada) {

      document.getElementById("lgIp").value =
        ipGuardada;

    }

  }
);


/* =========================
   SESIÓN
========================= */

async function comprobarSesion() {

  const resultado =
    await supabaseClient.auth.getSession();

  usuarioActual =
    resultado.data.session
      ? resultado.data.session.user
      : null;

  actualizarPanelAdmin();

}


async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const resultado =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (resultado.error) {

    document.getElementById("mensajeLogin").textContent =
      "❌ " + resultado.error.message;

    return;

  }

  usuarioActual =
    resultado.data.user;

  document.getElementById("mensajeLogin").textContent =
    "✅ Sesión iniciada";

  actualizarPanelAdmin();

  await cargarPeliculas();

}


async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  usuarioActual = null;

  actualizarPanelAdmin();

  alert("Sesión cerrada");

}


function abrirAdministracion() {

  if (usuarioActual) {

    document
      .getElementById("panelAdmin")
      .classList.toggle("visible");

  } else {

    document
      .getElementById("panelLogin")
      .classList.toggle("visible");

  }

}


function actualizarPanelAdmin() {

  const login =
    document.getElementById("panelLogin");

  const admin =
    document.getElementById("panelAdmin");

  if (usuarioActual) {

    login.classList.remove("visible");
    admin.classList.add("visible");

  } else {

    admin.classList.remove("visible");

  }

}


/* =========================
   PELÍCULAS
========================= */

async function cargarPeliculas() {

  const resultado =
    await supabaseClient
      .from("peliculas")
      .select("*")
      .order(
        "created_at",
        { ascending: false }
      );

  if (resultado.error) {

    console.error(resultado.error);

    document.getElementById("peliculas").innerHTML =
      '<div class="mensaje">❌ No se pudieron cargar las películas.</div>';

    return;

  }

  todasLasPeliculas =
    resultado.data || [];

  mostrarPeliculas();

}


function obtenerDatos(pelicula) {

  try {

    if (
      pelicula.descripcion &&
      typeof pelicula.descripcion === "string"
    ) {

      return JSON.parse(
        pelicula.descripcion
      );

    }

  } catch (error) {

    console.log("Descripción antigua");

  }

  return {
    anio: "",
    calidad: "",
    tamano: "",
    categoria: "principal",
    texto: pelicula.descripcion || ""
  };

}


function cambiarCategoria(categoria, boton) {

  categoriaActual = categoria;

  document
    .querySelectorAll(".categoria-btn")
    .forEach(function(btn) {

      btn.classList.remove("activo");

    });

  boton.classList.add("activo");

  document.getElementById("buscador").value = "";

  mostrarPeliculas();

}


function mostrarPeliculas() {

  const contenedor =
    document.getElementById("peliculas");

  const buscador =
    document.getElementById("buscador");

  let busqueda =
    (buscador.value || "")
      .toLowerCase()
      .trim();

  if (busqueda.includes("@")) {

    buscador.value = "";
    busqueda = "";

  }

  let peliculas =
    todasLasPeliculas.filter(function(pelicula) {

      const datos =
        obtenerDatos(pelicula);

      const categoria =
        datos.categoria || "principal";

      const textoBusqueda =
        (
          (pelicula.titulo || "") +
          " " +
          (datos.texto || "") +
          " " +
          (datos.anio || "") +
          " " +
          categoria
        ).toLowerCase();

      const coincideBusqueda =
        !busqueda ||
        textoBusqueda.includes(busqueda);

      let coincideCategoria = true;

      if (categoriaActual === "mari") {

        coincideCategoria =
          pelicula.favorita_mari === true;

      } else if (categoriaActual !== "todas") {

        const categoriaNormalizada =
          categoria === "familiares"
            ? "familia"
            : categoria;

        coincideCategoria =
          categoriaNormalizada === categoriaActual;

      }

      return (
        coincideBusqueda &&
        coincideCategoria
      );

    });

  if (peliculas.length === 0) {

    contenedor.innerHTML =
      '<div class="mensaje">🍿 No hay películas en esta sección.</div>';

    return;

  }

  contenedor.innerHTML =
    peliculas
      .map(function(pelicula) {

        const indice =
          todasLasPeliculas.indexOf(pelicula);

        return crearTarjeta(
          pelicula,
          indice
        );

      })
      .join("");

}


function crearTarjeta(pelicula, indice) {

  const datos =
    obtenerDatos(pelicula);

  const categoria =
    datos.categoria || "principal";

  let etiquetas = "";

  if (datos.anio) {

    etiquetas +=
      `<span class="etiqueta">${datos.anio}</span>`;

  }

  if (datos.calidad) {

    etiquetas +=
      `<span class="etiqueta">${datos.calidad}</span>`;

  }

  if (datos.tamano) {

    etiquetas +=
      `<span class="etiqueta">${datos.tamano}</span>`;

  }

  if (categoria === "familia") {

    etiquetas +=
      `<span class="etiqueta">👨‍👩‍👧 Familia</span>`;

  }

  if (categoria === "terror") {

    etiquetas +=
      `<span class="etiqueta">👻 Terror</span>`;

  }

  if (categoria === "accion") {

    etiquetas +=
      `<span class="etiqueta">💥 Acción</span>`;

  }

  if (pelicula.favorita_mari === true) {

    etiquetas +=
      `<span class="etiqueta favorita">❤️ Mari</span>`;

  }

  const poster =
    pelicula.poster_url || "";

  const descripcion =
    datos.texto || "";

  const enlaceDescarga =
    convertirDropbox(
      pelicula.videos_url || "",
      true
    );

  return `

    <div class="tarjeta">

      ${
        poster
          ? `<img
              class="poster"
              src="${poster}"
              alt="${pelicula.titulo}"
            >`
          : `<div class="poster"></div>`
      }

      <div class="contenido">

        <div class="titulo">
          ${pelicula.titulo}
        </div>

        <div class="etiquetas">
          ${etiquetas}
        </div>

        <div class="descripcion">
          ${descripcion}
        </div>

        <div class="botones">

          <button
            class="btn ver"
            onclick="verPeliculaPorIndice(${indice})"
          >
            ▶️ Ver
          </button>

          <!-- GOOGLE CAST: SIN CAMBIOS -->

          <button
            class="btn tv"
            onclick="transmitirPeliculaPorIndice(${indice})"
          >
            📺 TV
          </button>

          <!-- LG -->

          <button
            class="btn tv-lg"
            onclick="prepararTransmisionLG(${indice})"
          >
            📺 LG
          </button>

          ${
            enlaceDescarga
              ? `<a
                  class="btn descargar"
                  href="${enlaceDescarga}"
                  target="_blank"
                  rel="noopener"

/* =========================
   DROPBOX
========================= */

function convertirDropbox(url, descargar) {

  if (!url) {
    return "";
  }

  try {

    const nuevaUrl =
      new URL(url.trim());

    if (descargar) {

      nuevaUrl.searchParams.set("dl", "1");

      nuevaUrl.searchParams.delete("raw");

    } else {

      nuevaUrl.searchParams.delete("dl");

      nuevaUrl.searchParams.set("raw", "1");

    }

    return nuevaUrl.toString();

  } catch (error) {

    console.error(
      "Enlace Dropbox inválido:",
      error
    );

    return url.trim();

  }

}

/* =========================
   GOOGLE CAST / TV
   ORIGINAL
========================= */

async function transmitirPeliculaPorIndice(indice) {

  const pelicula =
    todasLasPeliculas[indice];

  if (!pelicula) {
    return;
  }

  const enlaceOriginal =
    pelicula.videos_url || "";

  if (!enlaceOriginal) {

    alert(
      "Esta película no tiene un enlace de Dropbox."
    );

    return;

  }

  if (
    typeof cast === "undefined" ||
    !cast.framework ||
    !cast.framework.CastContext
  ) {

    alert(
      "Google Cast no está disponible en este navegador."
    );

    return;

  }

  try {

    const castContext =
      cast.framework.CastContext.getInstance();

    await castContext.requestSession();

    const castSession =
      castContext.getCurrentSession();

    if (!castSession) {

      alert(
        "No se pudo conectar con la pantalla."
      );

      return;

    }

    const urlVideo =
      convertirDropbox(
        enlaceOriginal,
        false
      );

    const mediaInfo =
      new chrome.cast.media.MediaInfo(
        urlVideo,
        "video/mp4"
      );

    mediaInfo.metadata =
      new chrome.cast.media.GenericMediaMetadata();

    mediaInfo.metadata.title =
      pelicula.titulo || "Película";

    if (pelicula.poster_url) {

      mediaInfo.metadata.images = [
        {
          url: pelicula.poster_url
        }
      ];

    }

    const request =
      new chrome.cast.media.LoadRequest(
        mediaInfo
      );

    request.autoplay = true;

    await castSession.loadMedia(
      request
    );

    console.log(
      "Película enviada a la TV:",
      pelicula.titulo
    );

  } catch (error) {

    console.error(
      "Error al transmitir:",
      error
    );

    if (
      error &&
      error.code === "cancel"
    ) {
      return;
    }

    alert(
      "No se pudo transmitir la película a la pantalla."
    );

  }

}

/* =========================
   PROXY HTML
========================= */

function crearLGProxy() {

  if (lgProxyFrame) {
    return;
  }

  const html = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body>
<script>

let socket = null;
let contador = 0;
let pendientes = {};

function enviar(obj) {

  parent.postMessage(
    {
      fuente: "APO1_LG_PROXY",
      datos: obj
    },
    "*"
  );

}

function cerrar() {

  if (socket) {

    try {
      socket.close();
    } catch(e) {}

  }

  socket = null;

  enviar({
    tipo: "cerrado"
  });

}

window.addEventListener(
  "message",
  function(event) {

    const msg = event.data;

    if (
      !msg ||
      msg.fuente !== "APO1_LG_MAIN"
    ) {
      return;
    }

    if (
      msg.accion === "conectar"
    ) {

      const ip = msg.ip;

      if (!ip) {
        return;
      }

      cerrar();

      try {

        socket =
          new WebSocket(
            "ws://" +
            ip +
            ":3000"
          );

      } catch(error) {

        enviar({
          tipo: "error",
          mensaje:
            error.message || "Error WebSocket"
        });

        return;

      }

      socket.onopen =
        function() {

          enviar({
            tipo: "abierto"
          });

        };

      socket.onmessage =
        function(event) {

          enviar({
            tipo: "mensaje",
            datos: event.data
          });

        };

      socket.onerror =
        function() {

          enviar({
            tipo: "error",
            mensaje: "Error WebSocket"
          });

        };

      socket.onclose =
        function() {

          enviar({
            tipo: "cerrado"
          });

          socket = null;

        };

      return;
    }

    if (
      msg.accion === "enviar"
    ) {

      if (
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {

        enviar({
          tipo: "error",
          mensaje:
            "WebSocket no conectado"
        });

        return;

      }

      try {

        socket.send(
          JSON.stringify(
            msg.mensaje
          )
        );

      } catch(error) {

        enviar({
          tipo: "error",
          mensaje:
            error.message
        });

      }

      return;
    }

    if (
      msg.accion === "cerrar"
    ) {

      cerrar();

    }

  }
);

enviar({
  tipo: "proxy-listo"
});

<\/script>
</body>
</html>
`;

  lgProxyFrame =
    document.createElement("iframe");

  lgProxyFrame.id =
    "lgProxyFrame";

  lgProxyFrame.src =
    "data:text/html;charset=utf-8," +
    encodeURIComponent(html);

}

async function conectarLG() {

  const input =
    document.getElementById(
      "lgIp"
    );

  let ip =
    input.value
      .trim()
      .replace(
        /^https?:\/\//,
        ""
      )
      .replace(
        /\/.*$/,
        ""
      );

  if (!ip) {

    alert(
      "Escribe la IP de tu TV LG."
    );

    return;

  }

  lgIpActual =
    ip;

  localStorage.setItem(
    "lg_webos_tv_ip",
    ip
  );

  crearLGProxy();

  actualizarEstadoLG(
    "🟡 Preparando conexión con " +
    ip +
    "..."
  );

  lgLog(
    "Solicitando conexión directa con " +
    ip +
    ":3000"
  );

  if (!lgProxyReady) {

    await new Promise(
      function(resolve) {

        let intentos = 0;

        const timer =
          setInterval(
            function() {

              intentos++;

              if (
                lgProxyReady ||
                intentos >= 50
              ) {

                clearInterval(timer);

                resolve();

              }

            },
            100
          );

      }
    );

  }

  if (!lgProxyReady) {

    actualizarEstadoLG(
      "❌ No se pudo iniciar el módulo LG."
    );

    return;

  }

  lgEnviarAlProxy({
    fuente: "APO1_LG_MAIN",
    accion: "conectar",
    ip: ip
  });

}

/* =========================
   HELLO / REGISTRO
========================= */

function registrarLG() {

  const manifest = {

    manifestVersion: 1,

    appVersion: "1.0",

    signed: {
      created:
        "2026-01-01T00:00:00Z"
    },

    permissions: [

      "LAUNCH",

      "CONTROL_AUDIO",

      "CONTROL_DISPLAY",

      "READ_CURRENT_CHANNEL",

      "READ_INPUT_DEVICE_LIST",

      "CONTROL_INPUT_JOYSTICK_AND_BUTTONS",

      "CONTROL_MOUSE_AND_KEYBOARD",

      "CONTROL_POWER",

      "READ_INSTALLED_APPS",

      "READ_CURRENT_APP_INFO"

    ]

  };

  const payload = {

    pairingType:
      "PROMPT",

    manifest:
      manifest

  };

  if (lgClientKey) {

    payload["client-key"] =
      lgClientKey;

  }

  lgEnviarRaw({

    type:
      "register",

    id:
      "register_0",

    payload:
      payload

  });

  lgLog(
    lgClientKey
      ? "→ Registrando con clave guardada."
      : "→ Solicitando emparejamiento."
  );

}


/* =========================
   MENSAJES SSAP
========================= */

function manejarMensajeLG(data) {

  lgLog(
    "← " +
    JSON.stringify(data)
  );

  if (
    data.type === "hello"
  ) {

    registrarLG();

    return;

  }

  if (
    data.type === "registered"
  ) {

    const key =
      data.payload &&
      (
        data.payload["client-key"] ||
        data.payload.clientKey
      );

    if (key) {

      lgClientKey =
        key;

      localStorage.setItem(
        "lg_webos_client_key",
        lgClientKey
      );

      lgLog(
        "🔑 Clave de LG guardada."
      );

    }

    lgEstadoConexion = true;

    actualizarEstadoLG(
      "🟢 LG conectada y emparejada."
    );

    return;

  }

  if (
    data.type === "response" &&
    data.payload &&
    data.payload.pairingType
  ) {

    lgLog(
      "Método de emparejamiento: " +
      data.payload.pairingType
    );

    if (
      data.payload.pairingType ===
        "PROMPT"
    ) {

      actualizarEstadoLG(
        "🟡 Acepta el aviso de conexión en la TV LG..."
      );

    }

    return;

  }

  if (
    data.type === "response"
  ) {

    const id =
      data.id;

    if (
      lgPending[id]
    ) {

      if (
        data.error
      ) {

        lgPending[id].reject(
          data.error
        );

      } else {

        lgPending[id].resolve(
          data.payload
        );

      }

      delete lgPending[id];

    }

  }

}


/* =========================
   PETICIÓN SSAP
========================= */

function lgRequest(
  uri,
  payload = {}
) {

  return new Promise(
    function(resolve, reject) {

      if (
        !lgEstadoConexion
      ) {

        reject(
          new Error(
            "LG no está conectada."
          )
        );

        return;

      }

      const id =
        "request_" +
        (++lgProxyCounter);

      lgPending[id] = {

        resolve:
          resolve,

        reject:
          reject

      };

      lgEnviarRaw({

        type:
          "request",

        id:
          id,

        uri:
          uri,

        payload:
          payload

      });

      lgLog(
        "→ " +
        uri
      );

      setTimeout(
        function() {

          if (
            lgPending[id]
          ) {

            delete lgPending[id];

            reject(
              new Error(
                "Tiempo de espera agotado: " +
                uri
              )
            );

          }

        },
        10000
      );

    }
  );

}
