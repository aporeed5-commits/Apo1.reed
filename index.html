<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apo1.reed</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d0d12;
  color: white;
}

header {
  background: linear-gradient(135deg, #171722, #292943);
  padding: 30px 20px;
  text-align: center;
  border-bottom: 2px solid #3b3b5c;
}

header h1 {
  margin: 0;
  font-size: 42px;
}

header p {
  margin: 8px 0 0;
  color: #bbb;
}

.gatos {
  font-size: 30px;
  margin-bottom: 8px;
}

.contenedor {
  width: 92%;
  max-width: 1200px;
  margin: 25px auto;
}

.buscar {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #181820;
  color: white;
  font-size: 16px;
  margin-bottom: 18px;
}

.categorias {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.categoria-btn {
  border: none;
  border-radius: 12px;
  padding: 11px 16px;
  background: #222230;
  color: white;
  cursor: pointer;
  font-size: 15px;
}

.categoria-btn:hover,
.categoria-btn.activo {
  background: #5c4cff;
}

.peliculas {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 22px;
}

.tarjeta {
  background: #17171f;
  border: 1px solid #292936;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.poster {
  width: 100%;
  height: 330px;
  object-fit: cover;
  background: #222;
}

.contenido {
  padding: 15px;
}

.titulo {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.descripcion {
  color: #aaa;
  font-size: 14px;
  line-height: 1.4;
  margin: 10px 0;
}

.etiquetas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.etiqueta {
  background: #292943;
  border-radius: 8px;
  padding: 5px 8px;
  font-size: 12px;
  color: #ddd;
}

.favorita {
  background: #7b294e;
}

.botones {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  border: none;
  border-radius: 9px;
  padding: 10px 13px;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
  display: inline-block;
}

.ver {
  background: #5c4cff;
  color: white;
}

.descargar {
  background: #292936;
  color: white;
}

.eliminar {
  background: #8b2635;
  color: white;
}

.admin-boton {
  position: fixed;
  bottom: 15px;
  left: 15px;
  z-index: 1000;
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  background: #292936;
  color: white;
  cursor: pointer;
  font-size: 21px;
  box-shadow: 0 5px 18px rgba(0,0,0,.4);
}

.panel {
  display: none;
  background: #17171f;
  border: 1px solid #333344;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 25px;
}

.panel.visible {
  display: block;
}

.panel input,
.panel select,
.panel textarea {
  width: 100%;
  margin: 7px 0;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #444;
  background: #0e0e14;
  color: white;
}

.panel button {
  border: none;
  border-radius: 9px;
  padding: 11px 15px;
  background: #5c4cff;
  color: white;
  cursor: pointer;
  margin-top: 8px;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0;
}

.checkbox input {
  width: auto;
}

.mensaje {
  color: #aaa;
  text-align: center;
  padding: 35px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.visible {
  display: flex;
}

.modal-contenido {
  width: 100%;
  max-width: 1100px;
  position: relative;
}

#videoPlayer {
  width: 100%;
  max-height: 80vh;
  background: black;
  border-radius: 12px;
}

.controles-tv {
  margin-top: 10px;
}

.transmitir {
  background: #292936;
  color: white;
  width: 100%;
}

.transmitir:hover {
  background: #5c4cff;
}

.cerrar {
  position: absolute;
  right: 0;
  top: -45px;
  border: none;
  background: #8b2635;
  color: white;
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
}

.abrir-dropbox {
  display: inline-block;
  margin-top: 10px;
  color: #bbb;
  font-size: 13px;
}

@media(max-width:600px) {
  header h1 {
    font-size: 32px;
  }

  .poster {
    height: 300px;
  }
}
</style>
</head>

<body>

<header>
  <div class="gatos">🐈‍⬛ ✨ 🐈</div>
  <h1>Apo1.reed</h1>
  <p>Películas para nosotros 🍿</p>
</header>

<div class="contenedor">

  <input
    id="buscador"
    class="buscar"
    type="text"
    placeholder="🔎 Buscar película..."
    oninput="mostrarPeliculas()"
  >

  <div class="categorias">

    <button
      class="categoria-btn activo"
      onclick="cambiarCategoria('todas', this)"
    >
      🎬 Todas
    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('mari', this)"
    >
      ❤️ Mari
    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('familia', this)"
    >
      👨‍👩‍👧 Familia
    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('terror', this)"
    >
      👻 Terror
    </button>

    <button
      class="categoria-btn"
      onclick="cambiarCategoria('accion', this)"
    >
      💥 Acción
    </button>

  </div>

  <div id="panelLogin" class="panel">

    <h2>🔐 Administración</h2>

    <input
      id="email"
      type="email"
      placeholder="Correo"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button onclick="iniciarSesion()">
      Iniciar sesión
    </button>

    <p id="mensajeLogin"></p>

  </div>

  <div id="panelAdmin" class="panel">

    <h2>🎬 Agregar película</h2>

    <input
      id="titulo"
      placeholder="Título"
    >

    <input
      id="poster"
      placeholder="Enlace del póster"
    >

    <input
      id="enlace"
      placeholder="Enlace de Dropbox"
    >

    <input
      id="anio"
      placeholder="Año"
    >

    <input
      id="calidad"
      placeholder="Calidad (1080p, 720p...)"
    >

    <input
      id="tamano"
    placeholder="Tamaño (GB, MB...)"
    >

    <select id="categoria">
      <option value="principal">🎬 Principal</option>
      <option value="familia">👨‍👩‍👧 Familia</option>
      <option value="terror">👻 Terror</option>
      <option value="accion">💥 Acción</option>
    </select>

    <div class="checkbox">
      <input
        id="favoritaMari"
        type="checkbox"
      >
      <label for="favoritaMari">
        ❤️ Favorita de Mari
      </label>
    </div>

    <textarea
      id="descripcion"
      rows="4"
      placeholder="Descripción"
    ></textarea>

    <button onclick="agregarPelicula()">
      ➕ Agregar película
    </button>

    <button onclick="cerrarSesion()">
      Cerrar sesión
    </button>

    <p id="mensajeAdmin"></p>

  </div>

  <div id="peliculas" class="peliculas"></div>

</div>

<button
  class="admin-boton"
  onclick="abrirAdministracion()"
>
  ⚙️
</button>

<div id="modal" class="modal">

  <div class="modal-contenido">

    <button
      class="cerrar"
      onclick="cerrarVideo()"
    >
      ✕ Cerrar
    </button>

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    ></video>

    <div class="controles-tv">
      <button
        id="botonTV"
        class="btn transmitir"
        onclick="transmitirATV()"
      >
        📺 Ver en TV
      </button>
    </div>

    <a
      id="abrirDropbox"
      class="abrir-dropbox"
      target="_blank"
      rel="noopener"
    >
      Abrir enlace original de Dropbox
    </a>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://jnxtndenqxgqqzmmckco.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3gyntuSUrTd999iy3dbkoQ_d-CcVBG4";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let todasLasPeliculas = [];
let categoriaActual = "todas";
let usuarioActual = null;


/* =========================
   INICIO
========================= */

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    await comprobarSesion();

    await cargarPeliculas();

  }
);


/* =========================
   SESIÓN
========================= */

async function comprobarSesion() {

  const resultado =
    await supabaseClient.auth.getSession();

  usuarioActual =
    resultado.data.session
      ? resultado.data.session.user
      : null;

  actualizarPanelAdmin();
}


async function iniciarSesion() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const resultado =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (resultado.error) {

    document.getElementById(
      "mensajeLogin"
    ).textContent =
      "❌ " + resultado.error.message;

    return;
  }

  usuarioActual =
    resultado.data.user;

  document.getElementById(
    "mensajeLogin"
  ).textContent =
    "✅ Sesión iniciada";

  actualizarPanelAdmin();

  await cargarPeliculas();
}


async function cerrarSesion() {

  await supabaseClient.auth.signOut();

  usuarioActual = null;

  actualizarPanelAdmin();

  alert("Sesión cerrada");
}


function abrirAdministracion() {

  if (usuarioActual) {

    document
      .getElementById("panelAdmin")
      .classList.toggle("visible");

  } else {

    document
      .getElementById("panelLogin")
      .classList.toggle("visible");

  }
}


function actualizarPanelAdmin() {

  const login =
    document.getElementById("panelLogin");

  const admin =
    document.getElementById("panelAdmin");

  if (usuarioActual) {

    login.classList.remove("visible");

    admin.classList.add("visible");

  } else {

    admin.classList.remove("visible");

  }

}


/* =========================
   PELÍCULAS
========================= */

async function cargarPeliculas() {

  const resultado =
    await supabaseClient
      .from("peliculas")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (resultado.error) {

    console.error(
      resultado.error
    );

    document.getElementById(
      "peliculas"
    ).innerHTML =
      '<div class="mensaje">❌ No se pudieron cargar las películas.</div>';

    return;
  }

  todasLasPeliculas =
    resultado.data || [];

  mostrarPeliculas();
}


function obtenerDatos(pelicula) {

  try {

    if (
      pelicula.descripcion &&
      typeof pelicula.descripcion === "string"
    ) {

      return JSON.parse(
        pelicula.descripcion
      );

    }

  } catch (error) {

    console.log(
      "Descripción antigua"
    );

  }

  return {
    anio: "",
    calidad: "",
    tamano: "",
    categoria: "principal",
    texto: pelicula.descripcion || ""
  };
}


function cambiarCategoria(
  categoria,
  boton
) {

  categoriaActual =
    categoria;

  document
    .querySelectorAll(".categoria-btn")
    .forEach(function(btn) {

      btn.classList.remove(
        "activo"
      );

    });

  boton.classList.add(
    "activo"
  );

  mostrarPeliculas();
}


function mostrarPeliculas() {

  const contenedor =
    document.getElementById(
      "peliculas"
    );

  const busqueda =
    document
      .getElementById("buscador")
      .value
      .toLowerCase()
      .trim();

  let peliculas =
    todasLasPeliculas.filter(
      function(pelicula) {

        const datos =
          obtenerDatos(pelicula);

        const categoria =
          datos.categoria ||
          "principal";

        const textoBusqueda = (

          pelicula.titulo +
          " " +
          (datos.texto || "") +
          " " +
          (datos.anio || "") +
          " " +
          categoria

        ).toLowerCase();

        const coincideBusqueda =
          !busqueda ||
          textoBusqueda.includes(
            busqueda
          );

        let coincideCategoria =
          true;

        if (
          categoriaActual === "mari"
        ) {

          coincideCategoria =
            pelicula.favorita_mari === true;

        } else if (
          categoriaActual !== "todas"
        ) {

          const categoriaNormalizada =
            categoria === "familiares"
              ? "familia"
              : categoria;

          coincideCategoria =
            categoriaNormalizada ===
            categoriaActual;

        }

        return (
          coincideBusqueda &&
          coincideCategoria
        );

      }
    );

  if (
    peliculas.length === 0
  ) {

    contenedor.innerHTML =
      '<div class="mensaje">🍿 No hay películas en esta sección.</div>';

    return;
  }

  contenedor.innerHTML =
    peliculas
      .map(function(pelicula) {

        const indice =
          todasLasPeliculas.indexOf(
            pelicula
          );

        return crearTarjeta(
          pelicula,
          indice
        );

      })
      .join("");

}


function crearTarjeta(
  pelicula,
  indice
) {

  const datos =
    obtenerDatos(pelicula);

  const categoria =
    datos.categoria ||
    "principal";

  let etiquetas = "";

  if (datos.anio) {

    etiquetas +=
      `<span class="etiqueta">${datos.anio}</span>`;

  }

  if (datos.calidad) {

    etiquetas +=
      `<span class="etiqueta">${datos.calidad}</span>`;

  }

  if (datos.tamano) {

    etiquetas +=
      `<span class="etiqueta">${datos.tamano}</span>`;

  }

  if (categoria === "familia") {

    etiquetas +=
      `<span class="etiqueta">👨‍👩‍👧 Familia</span>`;

  }

  if (categoria === "terror") {

    etiquetas +=
      `<span class="etiqueta">👻 Terror</span>`;

  }

  if (categoria === "accion") {

    etiquetas +=
      `<span class="etiqueta">💥 Acción</span>`;

  }

  if (
    pelicula.favorita_mari === true
  ) {

    etiquetas +=
      `<span class="etiqueta favorita">❤️ Mari</span>`;

  }

  const poster =
    pelicula.poster_url ||
    "";

  const descripcion =
    datos
