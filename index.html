<html lang="es">
<head>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 50% 0%, #43205f 0%, #1b0d28 35%, #08060c 85%);
      min-height: 100vh;
    }

    /* =========================
       BANNER
    ========================= */

    .hero {
      min-height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 35px 15px;

      background:
        linear-gradient(
          rgba(8, 5, 12, .35),
          rgba(8, 5, 12, .8)
        ),
        radial-gradient(
          circle at center,
          #633b83,
          #241132 55%,
          #09060d 100%
        );

      border-bottom: 1px solid rgba(255,255,255,.12);
      position: relative;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "✦  ✧  ✦  ✧  ✦";
      position: absolute;
      color: rgba(255,255,255,.12);
      font-size: 25px;
      letter-spacing: 25px;
      white-space: nowrap;
    }

    .hero::before {
      top: 25px;
      left: -20px;
    }

    .hero::after {
      bottom: 25px;
      right: -20px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .cats {
      font-size: 55px;
      margin-bottom: 5px;
    }

    .logo {
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow:
        0 4px 20px rgba(0,0,0,.7);
    }

    .tagline {
      margin-top: 10px;
      color: #e5d5ed;
      font-size: 16px;
    }

    .popcorn {
      font-size: 27px;
      margin-top: 12px;
    }

    /* =========================
       BUSCADOR
    ========================= */

    .search-area {
      max-width: 850px;
      margin: -27px auto 20px;
      padding: 0 15px;
      position: relative;
      z-index: 5;
    }

    #buscador {
      width: 100%;
      padding: 17px 22px;
      border-radius: 35px;
      border: 1px solid #8b5bad;
      background: rgba(20, 10, 30, .95);
      color: white;
      font-size: 16px;
      outline: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    #buscador::placeholder {
      color: #c9b7d4;
    }

    /* =========================
       CATEGORÍAS
    ========================= */

    .categories {
      max-width: 1100px;
      margin: 20px auto 30px;
      padding: 0 15px;
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 11px 16px;
      border-radius: 25px;
      border: 1px solid #694783;
      background: rgba(36, 20, 49, .9);
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: .2s;
    }

    .category-btn:hover {
      transform: translateY(-2px);
      background: #5d3677;
    }

    .category-btn.active {
      background: #8d52b9;
      border-color: #b985d5;
      box-shadow: 0 5px 20px rgba(141,82,185,.3);
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-button-area {
      text-align: center;
      margin: 5px 0 25px;
    }

    .admin-toggle {
      background: rgba(55,31,71,.8);
      color: #eadcf1;
      border: 1px solid #714a88;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    #adminPanel {
      display: none;
      max-width: 750px;
      margin: 0 auto 35px;
      padding: 22px;
      border-radius: 20px;
      background: rgba(25, 13, 35, .97);
      border: 1px solid #754a91;
      box-shadow: 0 15px 40px rgba(0,0,0,.45);
    }

    .admin-title {
      text-align: center;
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border-radius: 9px;
      border: 1px solid #604075;
      background: #110a17;
      color: white;
      outline: none;
      font-size: 14px;
    }

    select option {
      background: #160d1e;
      color: white;
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }
