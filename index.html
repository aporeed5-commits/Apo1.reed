<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Películas1</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #1b1b1b;
    }

    h1 {
      margin: 0 0 15px;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    #buscador {
      width: 90%;
      max-width: 600px;
      padding: 12px;
      border-radius: 8px;
      border: none;
    }

    .contenedor {
      width: 95%;
      max-width: 1200px;
      margin: 20px auto;
    }

    .admin {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .admin input,
    .admin textarea {
      width: 100%;
      margin: 7px 0;
      padding: 10px;
      border-radius: 7px;
      border: none;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    .btn {
      background: #e50914;
      color: white;
    }

    .btn-secundario {
      background: #444;
      color: white;
    }

    #adminPanel {
      display: none;
    }

    #loginPanel {
      text-align: center;
      margin-bottom: 20px;
    }

    #peliculas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .pelicula {
      background: #1c1c1c;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.3);
    }

    .pelicula img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      background: #333;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      margin-top: 0;
    }

    .acciones {
      margin-top: 10px;
    }

    #mensaje {
      text-align: center;
      margin: 15px;
      color: #ccc;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,.85);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-contenido {
      width: 100%;
      max-width: 900px;
      background: #181818;
      padding: 15px;
      border-radius: 12px;
    }

    .modal video {
      width: 100%;
      max-height: 75vh;
      background: black;
    }

    .cerrar {
      float: right;
      background: #e50914;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 Películas1</h1>

  <input
    type="text"
    id="buscador"
    placeholder="Buscar película..."
    oninput="buscarPeliculas()"
  >
</header>

<div class="contenedor">

  <div id="loginPanel" class="admin">

    <h2>🔐 Administrador</h2>

    <input
      type="email"
      id="emailLogin"
      placeholder="Correo electrónico"
    >

    <input
      type="password"
      id="passwordLogin"
      placeholder="Contraseña"
    >

    <button class="btn" onclick="iniciarSesion()">
      Iniciar sesión
    </button>

  </div>


  <div id="adminPanel" class="admin">

    <h2>➕ Agregar película</h2>

    <input
      type="text"
      id="titulo"
      placeholder="Título de la película"
    >

    <input
      type="text"
      id="anio"
      placeholder="Año"
    >

    <input
      type="text"
      id="calidad"
      placeholder="Calidad (1080p, 720p...)"
    >

    <input
      type="text"
      id="tamano"
      placeholder="Tamaño (GB)"
    >

    <textarea
      id="descripcion"
      placeholder="Descripción"
      rows="4"
    ></textarea>

    <input
      type="text"
      id="poster"
      placeholder="Enlace de la carátula"
    >

    <input
      type="text"
      id="enlace"
      placeholder="Enlace de Dropbox de la película"
    >

    <button class="btn" onclick="agregarPelicula()">
      Agregar película
    </button>

    <button class="btn-secundario" onclick="cerrarSesion()">
      Cerrar sesión
    </button>

  </div>


  <div id="mensaje">
    Cargando películas...
  </div>


  <div id="peliculas"></div>

</div>


<div id="videoModal" class="modal">

  <div class="modal-contenido">

    <button class="cerrar" onclick="cerrarVideo()">
      Cerrar
    </button>

    <video
      id="videoPlayer"
      controls
      playsinline
    ></video>

    <div style="text-align:center;margin-top:10px;">

      <a
        id="abrirDropbox"
        href="#"
        target="_blank"
        style="color:white;"
      >
        Abrir en Dropbox
      </a>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://jnxtndenqxgqqzmmckco.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3gyntuSUrTd999iy3dbkoQ_d-CcVBG4";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let peliculas = [];


/* =====================================================
   CARGAR PELÍCULAS
   ===================================================== */

async function cargarPeliculas() {

  const { data, error } =
    await supabaseClient
      .from("peliculas")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    document.getElementById("mensaje").textContent =
      "Error al cargar las películas.";

    return;
  }


  peliculas = data || [];

  mostrarPeliculas(peliculas);
}


/* =====================================================
   MOSTRAR PELÍCULAS
   ===================================================== */

function mostrarPeliculas(lista) {

  const contenedor =
    document.getElementById("peliculas");

  contenedor.innerHTML = "";


  if (lista.length === 0) {

    document.getElementById("mensaje").textContent =
      "No hay películas todavía.";

    return;
  }


  document.getElementById("mensaje").textContent =
    `${lista.length} película(s)`;


  lista.forEach(pelicula => {

    let datos = {};


    try {

      datos =
        JSON.parse(
          pelicula.descripcion || "{}"
        );

    } catch {

      datos = {};

    }


    const tarjeta =
      document.createElement("div");

    tarjeta.className =
      "pelicula";


    const imagen =
      pelicula.poster_url ||
      "https://via.placeholder.com/400x600?text=Sin+carátula";


    tarjeta.innerHTML = `

      <img
        src="${imagen}"
        alt="${escapeHTML(pelicula.titulo)}"
      >

      <div class="info">

        <h3>
          ${escapeHTML(pelicula.titulo)}
        </h3>

        <p>
          ${datos.anio || ""}
          ${datos.calidad ? " • " + datos.calidad : ""}
          ${datos.tamano ? " • " + datos.tamano : ""}
        </p>

        <p>
          ${escapeHTML(datos.texto || "")}
        </p>

        <div class="acciones">

          <button
            class="btn"
            onclick="verPelicula('${pelicula.videos_url}')"
          >
            ▶ Ver
          </button>


          <a
            href="${convertirDropbox(
              pelicula.videos_url,
              true
            )}"
            target="_blank"
          >

            <button class="btn-secundario">
              ⬇ Descargar
            </button>

          </a>


          ${
            document.getElementById("adminPanel").style.display === "block"
            ?
            `
            <button
              class="btn-secundario"
              onclick="eliminarPelicula('${pelicula.id}')"
            >
              🗑 Eliminar
            </button>
            `
            :
            ""
          }

        </div>

      </div>
    `;


    contenedor.appendChild(tarjeta);

  });

}


/* =====================================================
   BUSCAR
   ===================================================== */

function buscarPeliculas() {

  const texto =
    document
      .getElementById("buscador")
      .value
      .toLowerCase();


  const resultado =
    peliculas.filter(p =>
      (p.titulo || "")
        .toLowerCase()
        .includes(texto)
    );


  mostrarPeliculas(resultado);

}


/* =====================================================
   INICIAR SESIÓN
   ===================================================== */

async function iniciarSesion() {

  const email =
    document.getElementById("emailLogin").value;

  const password =
    document.getElementById("passwordLogin").value;


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    alert(
      "No se pudo iniciar sesión:\n" +
      error.message
    );

    return;
  }


  document.getElementById("loginPanel")
    .style.display = "none";


  document.getElementById("adminPanel")
    .style.display = "block";


  mostrarPeliculas(peliculas);

  alert("Sesión iniciada correctamente.");

}


/* =====================================================
   CERRAR SESIÓN
   ===================================================== */

async function cerrarSesion() {

  await supabaseClient.auth.signOut();


  document.getElementById("adminPanel")
    .style.display = "none";


  document.getElementById("loginPanel")
    .style.display = "block";


  mostrarPeliculas(peliculas);

}


/* =====================================================
   AGREGAR PELÍCULA
   ===================================================== */

async function agregarPelicula() {

  const titulo =
    document.getElementById("titulo")
      .value
      .trim();


  const anio =
    document.getElementById("anio")
      .value
      .trim();


  const calidad =
    document.getElementById("calidad")
      .value
      .trim();


  const tamano =
    document.getElementById("tamano")
      .value
      .trim();


  const descripcion =
    document.getElementById("descripcion")
      .value
      .trim();


  const poster =
    document.getElementById("poster")
      .value
      .trim();


  const enlace =
    document.getElementById("enlace")
      .value
      .trim();


  if (!titulo || !enlace) {

    alert(
      "Escribe al menos el título y el enlace de la película."
    );

    return;
  }


  const datos = {

    anio: anio,

    calidad: calidad,

    tamano: tamano,

    texto: descripcion

  };


  const { error } =
    await supabaseClient
      .from("peliculas")
      .insert({

        titulo: titulo,

        descripcion:
          JSON.stringify(datos),

        poster_url:
          poster,

        videos_url:
          enlace

      });


  if (error) {

    console.error(error);

    alert(
      "No se pudo agregar la película:\n" +
      error.message
    );

    return;
  }


  alert(
    "Película agregada correctamente."
  );


  document.getElementById("titulo").value = "";

  document.getElementById("anio").value = "";

  document.getElementById("calidad").value = "";

  document.getElementById("tamano").value = "";

  document.getElementById("descripcion").value = "";

  document.getElementById("poster").value = "";

  document.getElementById("enlace").value = "";


  await cargarPeliculas();

}


/* =====================================================
   ELIMINAR PELÍCULA
   ===================================================== */

async function eliminarPelicula(id) {

  if (
    !confirm(
      "¿Seguro que quieres eliminar esta película?"
    )
  ) {

    return;
  }


  const { error } =
    await supabaseClient
      .from("peliculas")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "No se pudo eliminar:\n" +
      error.message
    );

    return;
  }


  await cargarPeliculas();

}


/* =====================================================
   DROPBOX
   ===================================================== */

function convertirDropbox(
  url,
  descarga = false
) {

  if (!url) return "";


  let nuevaURL = url;


  nuevaURL =
    nuevaURL.replace(
      "www.dropbox.com",
      "dl.dropboxusercontent.com"
    );


  nuevaURL =
    nuevaURL.replace(
      /[?&]dl=\d/g,
      ""
    );


  nuevaURL =
    nuevaURL.replace(
      /[?&]raw=\d/g,
      ""
    );


  if (descarga) {

    return nuevaURL + "?dl=1";

  }


  return nuevaURL;

}


/* =====================================================
   REPRODUCIR
   ===================================================== */

function verPelicula(url) {

  const video =
    document.getElementById("videoPlayer");


  const modal =
    document.getElementById("videoModal");


  const dropbox =
    document.getElementById("abrirDropbox");


  const videoURL =
    convertirDropbox(url, false);


  video.src = videoURL;

  dropbox.href = url;

  modal.style.display = "flex";


  video.play().catch(() => {});

}


/* =====================================================
   CERRAR VIDEO
   ===================================================== */

function cerrarVideo() {

  const video =
    document.getElementById("videoPlayer");


  video.pause();

  video.src = "";


  document.getElementById("videoModal")
    .style.display = "none";

}


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapeHTML(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text || "";


  return div.innerHTML;

}


/* =====================================================
   COMPROBAR SESIÓN
   ===================================================== */

async function comprobarSesion() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    document.getElementById("loginPanel")
      .style.display = "none";


    document.getElementById("adminPanel")
      .style.display = "block";

  }

}


/* =====================================================
   INICIO
   ===================================================== */

cargarPeliculas();

comprobarSesion();

</script>

</body>
</html>
