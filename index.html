<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apo1.reed</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #30204d 0%, #17121f 35%, #0d0b11 100%);
      color: #fff;
      min-height: 100vh;
    }

    /* BANNER */

    .banner {
      width: 100%;
      padding: 35px 20px 30px;
      text-align: center;
      background:
        linear-gradient(135deg, #241633, #5b357e, #21152d);
      border-bottom: 2px solid #8e5bb7;
      box-shadow: 0 5px 25px rgba(0,0,0,.45);
    }

    .gatos {
      font-size: 45px;
      margin-bottom: 5px;
    }

    .titulo {
      margin: 0;
      font-size: clamp(38px, 8vw, 70px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,.6);
    }

    .subtitulo {
      margin: 10px 0 0;
      color: #eadcff;
      font-size: 17px;
    }

    .palomitas {
      font-size: 28px;
      margin-top: 12px;
    }

    /* CONTENEDOR */

    .contenedor {
      width: min(1200px, 94%);
      margin: 25px auto 50px;
    }

    /* BUSCADOR */

    .buscador {
      width: 100%;
      padding: 16px 20px;
      border-radius: 15px;
      border: 1px solid #63487d;
      background: #17121e;
      color: white;
      font-size: 16px;
      outline: none;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    .buscador:focus {
      border-color: #bd82f1;
      box-shadow: 0 0 0 3px rgba(189,130,241,.15);
    }

    /* CATEGORÍAS */

    .categorias {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 22px 0;
    }

    .categoria-btn {
      border: 1px solid #64457e;
      background: #21182b;
      color: #eee;
      padding: 11px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      transition: .2s;
    }

    .categoria-btn:hover {
      transform: translateY(-2px);
      background: #352044;
    }

    .categoria-btn.activa {
      background: #8b52b8;
      border-color: #b57bdd;
      color: white;
      box-shadow: 0 5px 18px rgba(139,82,184,.35);
    }

    /* ADMIN */

    .admin-bar {
      text-align: center;
      margin: 15px 0 25px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-size: 14px;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-admin {
      background: #49305e;
      border: 1px solid #76528f;
    }

    .btn-principal {
      background: #8a4db7;
    }

    .btn-ver {
      background: #71409b;
      flex: 1;
    }

    .btn-descargar {
      background: #355c78;
      flex: 1;
    }

    .btn-eliminar {
      background: #8f3047;
      width: 100%;
      margin-top: 9px;
    }

    /* LOGIN Y FORMULARIO */

    .panel {
      display: none;
      background: rgba(22,16,29,.95);
      border: 1px solid #63477b;
      border-radius: 18px;
      padding: 22px;
      margin: 20px 0;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .panel.visible {
      display: block;
    }

    .panel h2 {
      margin-top: 0;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      color: #dfcbed;
      font-size: 14px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #5d4471;
      background: #100d14;
      color: white;
      outline: none;
      font-family: inherit;
    }

    .campo textarea {
      min-height: 90px;
      resize: vertical;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
      border-color: #b678df;
    }

    .fila {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 15px 0;
      color: #ffd9e9;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
    }

    .mensaje {
      margin-top: 12px;
      color: #e5cfff;
      text-align: center;
    }

    /* PELÍCULAS */

    .titulo-seccion {
      margin: 30px 0 18px;
      font-size: 26px;
    }

    .peliculas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
    }

    .pelicula {
      background: linear-gradient(180deg, #201727, #141017);
      border: 1px solid #44334f;
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 9px 25px rgba(0,0,0,.3);
      transition: .25s;
    }

    .pelicula:hover {
      transform: translateY(-5px);
      border-color: #79549a;
    }

    .poster-contenedor {
      position: relative;
      background: #0b0910;
      aspect-ratio: 2 / 3;
      overflow: hidden;
    }

    .poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-sin-imagen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      color: #796b82;
    }

    .favorita {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(120,25,60,.9);
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 13px;
    }

    .contenido-pelicula {
      padding: 15px;
    }

    .nombre-pelicula {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 9px;
    }

    .badge {
      background: #382443;
      color: #ddc5e9;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 11px;
    }

    .descripcion {
      color: #c2b8c7;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 13px;
    }

    .botones {
      display: flex;
      gap: 7px;
    }

    .sin-resultados {
      text-align: center;
      color: #b8aebe;
      padding: 45px 10px;
      grid-column: 1 / -1;
    }

    /* MODAL VIDEO */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,.9);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.visible {
      display: flex;
    }

    .modal-contenido {
      width: min(1100px, 100%);
      position: relative;
    }

    .video {
      width: 100%;
      max-height: 85vh;
      background: black;
      border-radius: 12px;
    }

    .cerrar {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      border: 0;
      background: #8d3b55;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .abrir-dropbox {
      display: inline-block;
      margin-top: 10px;
      color: #e4c8ff;
      text-decoration: none;
    }

    /* RESPONSIVE */

    @media (max-width: 650px) {
      .fila {
        grid-template-columns: 1fr;
      }

      .peliculas {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .contenido-pelicula {
        padding: 10px;
      }

      .nombre-pelicula {
        font-size: 16px;
      }

      .botones {
        flex-direction: column;
      }

      .btn-ver,
      .btn-descargar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- BANNER -->

  <header class="banner">
    <div class="gatos">🐈‍⬛ ✨ 🐈</div>
    <h1 class="titulo">Apo1.reed</h1>
    <p class="subtitulo">Nuestra pequeña colección de películas 🍿</p>
    <div class="palomitas">🍿 🎬 🍿</div>
  </header>

  <main class="contenedor">

    <!-- BUSCADOR -->

    <input
      id="buscador"
      class="buscador"
      type="text"
      placeholder="🔎 Buscar una película..."
      oninput="mostrarPeliculas()"
    >

    <!-- CATEGORÍAS -->

    <div class="categorias">

      <button
        class="categoria-btn activa"
        data-categoria="todas"
        onclick="cambiarCategoria('todas', this)"
      >
        🎬 Todas
      </button>

      <button
        class="categoria-btn"
        data-categoria="mari"
        onclick="cambiarCategoria('mari', this)"
      >
        ❤️ Mari
      </button>

      <button
        class="categoria-btn"
        data-categoria="familiares"
        onclick="cambiarCategoria('familiares', this)"
      >
        👨‍👩‍👧 Familiares
      </button>

      <button
        class="categoria-btn"
        data-categoria="terror"
        onclick="cambiarCategoria('terror', this)"
      >
        👻 Terror
      </button>

      <button
        class="categoria-btn"
        data-categoria="accion"
        onclick="cambiarCategoria('accion', this)"
      >
        💥 Acción
      </button>

    </div>

    <!-- ADMIN -->

    <div class="admin-bar">
      <button
        id="btnAdmin"
        class="btn btn-admin"
        onclick="mostrarLogin()"
      >
        🔐 Administración
      </button>
    </div>

    <!-- LOGIN -->

    <section id="loginPanel" class="panel">

      <h2>🔐 Entrar como administrador</h2>

      <div class="campo">
        <label>Correo</label>
        <input id="loginEmail" type="email" placeholder="Tu correo">
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input id="loginPassword" type="password" placeholder="Tu contraseña">
      </div>

      <button class="btn btn-principal" onclick="iniciarSesion()">
        Entrar
      </button>

      <div id="loginMensaje" class="mensaje"></div>

    </section>

    <!-- PANEL ADMINISTRADOR -->

    <section id="adminPanel" class="panel">

      <h2>🎬 Agregar película</h2>

      <div class="fila">

        <div class="campo">
          <label>Título</label>
          <input id="titulo" type="text" placeholder="Ej. Coraline">
        </div>

        <div class="campo">
          <label>Año</label>
          <input id="anio" type="text" placeholder="Ej. 2009">
        </div>

      </div>

      <div class="fila">

        <div class="campo">
          <label>Calidad</label>
          <input id="calidad" type="text" placeholder="Ej. 1080p">
        </div>

        <div class="campo">
          <label>Tamaño</label>
          <input id="tamano" type="text" placeholder="Ej. 1.5 GB">
        </div>

      </div>

      <div class="campo">
        <label>Categoría</label>

        <select id="categoria">
          <option value="principal">🎬 Principal</option>
          <option value="familiares">👨‍👩‍👧 Familiares</option>
          <option value="terror">👻 Terror</option>
          <option value="accion">💥 Acción</option>
        </select>

      </div>

      <div class="campo">
        <label>Descripción</label>
        <textarea
          id="descripcion"
          placeholder="Escribe una pequeña descripción..."
        ></textarea>
      </div>

      <div class="campo">
        <label>URL del póster</label>
        <input
          id="poster"
          type="url"
          placeholder="https://..."
        >
      </div>

      <div class="campo">
        <label>Enlace de Dropbox</label>
        <input
          id="enlace"
          type="url"
          placeholder="https://www.dropbox.com/..."
        >
      </div>

      <label class="checkbox">
        <input id="favoritaMari" type="checkbox">
        ❤️ Favorita de Mari
      </label>

      <button class="btn btn-principal" onclick="agregarPelicula()">
        ➕ Agregar película
      </button>

      <button
        class="btn btn-admin"
        onclick="cerrarSesion()"
        style="margin-left:8px;"
      >
        Cerrar sesión
      </button>

      <div id="adminMensaje" class="mensaje"></div>

    </section>

    <h2 id="tituloSeccion" class="titulo-seccion">
      🎬 Todas las películas
    </h2>

    <!-- PELÍCULAS -->

    <section id="peliculas" class="peliculas"></section>

  </main>

  <!-- MODAL VIDEO -->

  <div id="modal" class="modal">

    <div class="modal-contenido">

      <button class="cerrar" onclick="cerrarVideo()">×</button>

      <video
        id="videoPlayer"
        class="video"
        controls
        playsinline
      ></video>

      <a
        id="abrirDropbox"
        class="abrir-dropbox"
        target="_blank"
        rel="noopener"
      >
        Abrir directamente en Dropbox
      </a>

    </div>

  </div>


  <script>

    /* ================================
       SUPABASE
    ================================= */

    const SUPABASE_URL =
      "https://jnxtndenqxgqqzmmckco.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_3gyntuSUrTd999iy3dbkoQ_d-CcVBG4";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ================================
       VARIABLES
    ================================= */

    let todasLasPeliculas = [];

    let categoriaActual = "todas";

    let usuarioActual = null;


    /* ================================
       INICIAR
    ================================= */

    document.addEventListener("DOMContentLoaded", async () => {

      await comprobarSesion();

      await cargarPeliculas();

    });


    /* ================================
       SESIÓN
    ================================= */

    async function comprobarSesion() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);
        return;
      }

      usuarioActual = data.session?.user || null;

      actualizarAdmin();

    }


    function actualizarAdmin() {

      const loginPanel =
        document.getElementById("loginPanel");

      const adminPanel =
        document.getElementById("adminPanel");

      const btnAdmin =
        document.getElementById("btnAdmin");


      if (usuarioActual) {

        loginPanel.classList.remove("visible");

        adminPanel.classList.add("visible");

        btnAdmin.style.display = "none";

      } else {

        adminPanel.classList.remove("visible");

        btnAdmin.style.display = "inline-block";

      }

    }


    function mostrarLogin() {

      document
        .getElementById("loginPanel")
        .classList.toggle("visible");

    }


    async function iniciarSesion() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const mensaje =
        document.getElementById("loginMensaje");


      if (!email || !password) {

        mensaje.textContent =
          "Escribe tu correo y contraseña.";

        return;

      }


      mensaje.textContent = "Entrando...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        console.error(error);

        mensaje.textContent =
          "No se pudo iniciar sesión.";

        return;

      }


      usuarioActual = data.user;

      mensaje.textContent = "";

      actualizarAdmin();

      await cargarPeliculas();

    }


    async function cerrarSesion() {

      await supabaseClient.auth.signOut();

      usuarioActual = null;

      actualizarAdmin();

      mostrarPeliculas();

    }


    /* ================================
       CARGAR PELÍCULAS
    ================================= */

    async function cargarPeliculas() {

      const contenedor =
        document.getElementById("peliculas");

      contenedor.innerHTML =
        `<div class="sin-resultados">🎬 Cargando películas...</div>`;


      const { data, error } =
        await supabaseClient
          .from("peliculas")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error("Error Supabase:", error);

        contenedor.innerHTML =
          `<div class="sin-resultados">
            ❌ No se pudieron cargar las películas.
          </div>`;

        return;

      }


      todasLasPeliculas = data || [];

      mostrarPeliculas();

    }


    /* ================================
       DATOS DE PELÍCULA
    ================================= */

    function obtenerDatos(pelicula) {

      try {

        if (!pelicula.descripcion) {

          return {};

        }

        const datos =
          JSON.parse(pelicula.descripcion);

        return datos || {};

      } catch (error) {

        return {
          texto: pelicula.descripcion || ""
        };

      }

    }


    /* ================================
       CATEGORÍAS
    ================================= */

    function cambiarCategoria(categoria, boton) {

      categoriaActual = categoria;


      document
        .querySelectorAll(".categoria-btn")
        .forEach(btn => {
          btn.classList.remove("activa");
        });


      boton.classList.add("activa");


      const titulo =
        document.getElementById("tituloSeccion");


      const nombres = {

        todas: "🎬 Todas las películas",

        mari: "❤️ Películas favoritas de Mari",

        familiares: "👨‍👩‍👧 Películas familiares",

        terror: "👻 Películas de terror",

        accion: "💥 Películas de acción"

      };


      titulo.textContent =
        nombres[categoria] || "🎬 Películas";


      mostrarPeliculas();

    }


    /* ================================
       MOSTRAR PELÍCULAS
    ================================= */

    function mostrarPeliculas() {

      const contenedor =
        document.getElementById("peliculas");

      const buscador =
        document
          .getElementById("buscador")
          .value
          .trim()
          .toLowerCase();


      let peliculas =
        [...todasLasPeliculas];


      /* BUSCADOR */

      if (buscador) {

        peliculas =
          peliculas.filter(pelicula => {

            const datos =
              obtenerDatos(pelicula);

            const texto =
              [
                pelicula.titulo,
                datos.texto,
                datos.categoria,
                datos.anio
              ]
              .join(" ")
              .toLowerCase();


            return texto.includes(buscador);

          });

      }


      /* CATEGORÍA */

      if (categoriaActual === "mari") {

        peliculas =
          peliculas.filter(pelicula =>
            pelicula.favorita_mari === true
          );

      }

      else if (categoriaActual !== "todas") {

        peliculas =
          peliculas.filter(pelicula => {

            const datos =
              obtenerDatos(pelicula);

            const categoria =
              datos.categoria || "principal";

            return categoria === categoriaActual;

          });

      }


      if (peliculas.length === 0) {

        contenedor.innerHTML =
          `<div class="sin-resultados">
            🍿 No encontramos películas aquí todavía.
          </div>`;

        return;

      }


      contenedor.innerHTML =
        peliculas
          .map(crearTarjeta)
          .join("");

    }


    /* ================================
       TARJETA
    ================================= */

    function crearTarjeta(pelicula) {

      const datos =
        obtenerDatos(pelicula);


      const categoria =
        datos.categoria || "principal";


      const texto =
        datos.texto || "";


      const anio =
        datos.anio || "";


      const calidad =
        datos.calidad || "";


      const tamano =
        datos.tamano || "";


      const poster =
        pelicula.poster_url || "";


      const videoUrl =
        convertirDropbox(pelicula.videos_url || "");


      const downloadUrl =
        convertirDropbox(pelicula.videos_url || "", true);


      const favorita =
        pelicula.favorita_mari === true;


      const nombreCategoria = {

        principal: "🎬 Principal",

        familiares: "👨‍👩‍👧 Familiares",

        terror: "👻 Terror",

        accion: "💥 Acción"

      }[categoria] || "🎬 Principal";


      let html = `

        <article class="pelicula">

          <div class="poster-contenedor">

            ${
              poster
              ?
              `<img
                class="poster"
                src="${escaparHTML(poster)}"
                alt="${escaparHTML(pelicula.titulo || "Película")}"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
              >`
              :
              ""
            }

            <div
              class="poster-sin-imagen"
              style="${poster ? "display:none;" : "display:flex;"}"
            >
              🎬
