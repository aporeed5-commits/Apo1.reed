<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0d0d12;color:white}
header{background:linear-gradient(135deg,#171722,#292943);padding:30px 20px;text-align:center;border-bottom:2px solid #3b3b5c}

header p{margin:8px 0 0;color:#bbb}
.gatos{font-size:30px;margin-bottom:8px}
.contenedor{width:92%;max-width:1200px;margin:25px auto}
.buscar{width:100%;padding:15px;border-radius:12px;border:1px solid #444;background:#181820;color:white;font-size:16px;margin-bottom:10px}
.aviso-reproductor{margin:0 0 20px;padding:11px 14px;border:1px solid #33334a;border-radius:10px;background:#17171f;color:#aaa;font-size:13px;line-height:1.45;text-align:center}

.poster{width:100%;height:330px;object-fit:cover;background:#222}
.poster-fallback{display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center;padding:15px}
.contenido{padding:15px}
.titulo{font-size:20px;font-weight:bold;margin-bottom:10px}
.descripcion{color:#aaa;font-size:14px;line-height:1.4;margin:10px 0}
.etiquetas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.etiqueta{background:#292943;border-radius:8px;padding:5px 8px;font-size:12px;color:#ddd}
.favorita{background:#7b294e}
.botones{display:flex;gap:8px;flex-wrap:wrap}

.ver{background:#5c4cff;color:white}
.ver-dropbox{background:#147ef5;color:white}
.descargar{background:#292936;color:white}
.eliminar{background:#8b2635;color:white}
.editar{background:#287a48;color:white}
.admin-boton{position:fixed;bottom:18px;left:18px;z-index:99999;border:none;border-radius:50%;width:48px;height:48px;background:#292936;color:white;cursor:pointer;font-size:21px;box-shadow:0 5px 18px rgba(0,0,0,.4)}
.panel{display:none;background:#17171f;border:1px solid #333344;padding:20px;border-radius:15px;margin-bottom:25px}
.panel.visible{display:block}
.panel input,.panel select,.panel textarea{width:100%;margin:7px 0;padding:12px;border-radius:9px;border:1px solid #444;background:#0e0e14;color:white}
.panel button{border:none;border-radius:9px;padding:11px 15px;background:#5c4cff;color:white;cursor:pointer;margin-top:8px}
.panel button:disabled{opacity:.65;cursor:wait}
.checkbox{display:flex;align-items:center;gap:8px;margin:10px 0}
.checkbox input{width:auto}
.mensaje{color:#aaa;text-align:center;padding:35px}
.modal{display:none!important;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal.visible{display:flex!important}
.modal[hidden],.modal:not(.visible){display:none!important}
.modal-contenido{width:100%;max-width:1100px;position:relative}
#videoPlayer{display:block;width:100%;height:auto;max-height:80vh;background:black;border-radius:12px;object-fit:contain}

@media(max-width:600px){header h1{font-size:32px}.poster{height:300px}}
</style>

<body>
<header>
  <div class="gatos">🐈‍⬛ ✨ 🐈</div>
  <h1>Apo1.reed</h1>
  <p>Películas para nosotros 🍿</p>
</header>
<div class="contenedor">
  <input id="buscador" name="movie-search" class="buscar" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" placeholder="🔎 Buscar película..." oninput="mostrarPeliculas()">

  <div class="categorias">
    <button class="categoria-btn activo" onclick="cambiarCategoria('todas', this)">🎬 Todas</button>
    <button class="categoria-btn" onclick="cambiarCategoria('mari', this)">❤️ Mari</button>
    <button class="categoria-btn" onclick="cambiarCategoria('familia', this)">👨‍👩‍👧 Familia</button>
    <button class="categoria-btn" onclick="cambiarCategoria('terror', this)">👻 Terror</button>
    <button class="categoria-btn" onclick="cambiarCategoria('accion', this)">💥 Acción</button>
  </div>
  <div id="panelLogin" class="panel">
    <h2>🔐 Administración</h2>
    <input id="email" name="email-admin" type="email" autocomplete="email" placeholder="Correo">
    <input id="password" name="password-admin" type="password" autocomplete="current-password" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar sesión</button>
    <p id="mensajeLogin"></p>
  </div>
  <div id="panelAdmin" class="panel">
    <h2 id="tituloFormulario">🎬 Agregar película</h2>
    <input id="titulo" placeholder="Título">
    <input id="poster" placeholder="Enlace del póster principal">
    <input id="poster2" placeholder="Segundo enlace del póster (opcional)">
    <input id="enlace" placeholder="Enlace de Dropbox">
    <input id="anio" placeholder="Año">
    <input id="calidad" placeholder="Calidad (1080p, 720p...)">
    <input id="tamano" placeholder="Tamaño (GB, MB...)">
    <select id="categoria">
      <option value="principal">🎬 Principal</option>
      <option value="familia">👨‍👩‍👧 Familia</option>
      <option value="terror">👻 Terror</option>
      <option value="accion">💥 Acción</option>
    </select>
    <div class="checkbox"><input id="favoritaMari" type="checkbox"><label for="favoritaMari">❤️ Favorita de Mari</label></div>

</div>
<button id="adminBoton" class="admin-boton" type="button" onclick="abrirAdministracion()" aria-label="Abrir administración">⚙️</button>
<div id="modal" class="modal" hidden>
  <div class="modal-contenido">
    <button class="cerrar" onclick="cerrarVideo()">✕ Cerrar</button>
    <video id="videoPlayer" controls playsinline webkit-playsinline preload="auto" type="video/mp4"></video>
    <a id="abrirDropbox" class="abrir-dropbox" target="_blank" rel="noopener">Abrir enlace original de Dropbox</a>
  </div>
</div>
<script>
const SUPABASE_URL="https://jnxtndenqxgqqzmmckco.supabase.co";
const SUPABASE_KEY="sb_publishable_3gyntuSUrTd999iy3dbkoQ_d-CcVBG4";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let todasLasPeliculas=[];
let categoriaActual="todas";
let usuarioActual=null;
let peliculaEditandoId=null;

let googleCastDisponible=false;
let googleCastInicializado=false;
let castEnviando=false;

window.__onGCastApiAvailable=function(isAvailable){
  console.log("Google Cast API disponible:",isAvailable);
  googleCastDisponible=!!isAvailable;
  if(isAvailable) inicializarGoogleCast();
};

function inicializarGoogleCast(){
  if(googleCastInicializado) return true;
  try{
    if(typeof cast==="undefined" || !cast.framework ||
       !cast.framework.CastContext ||
       typeof chrome==="undefined" || !chrome.cast){
      console.warn("Google Cast todavía no está listo.");
      return false;
    }
    const context=cast.framework.CastContext.getInstance();
    context.setOptions({
      receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
      autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });
    context.addEventListener(
      cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
      function(event){
        console.log("Estado de sesión Cast:",event.sessionState);
      }
    );
    googleCastDisponible=true;
    googleCastInicializado=true;
    console.log("Google Cast inicializado.");
    return true;
  }catch(error){
    console.error("Error inicializando Google Cast:",error);
    return false;
  }
}

window.addEventListener("load",function(){
  setTimeout(function(){if(!googleCastInicializado) inicializarGoogleCast();},500);
});

document.addEventListener("DOMContentLoaded",async function(){
  document.getElementById("modal").hidden=true;
  document.getElementById("modal").classList.remove("visible");
  cerrarVideo();
  document.getElementById("buscador").value="";
  await comprobarSesion();
  await cargarPeliculas();
});

async function comprobarSesion(){
  const resultado=await supabaseClient.auth.getSession();
  usuarioActual=resultado.data.session?resultado.data.session.user:null;
  actualizarPanelAdmin();
}

async function iniciarSesion(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const resultado=await supabaseClient.auth.signInWithPassword({email,password});
  if(resultado.error){
    document.getElementById("mensajeLogin").textContent="❌ "+resultado.error.message;
    return;
  }
  usuarioActual=resultado.data.user;
  document.getElementById("mensajeLogin").textContent="✅ Sesión iniciada";
  actualizarPanelAdmin();
  await cargarPeliculas();
}

async function cerrarSesion(){
  await supabaseClient.auth.signOut();
  usuarioActual=null;
  cancelarEdicion();
  actualizarPanelAdmin();
  alert("Sesión cerrada");
}

function abrirAdministracion(){
  if(usuarioActual){
    document.getElementById("panelAdmin").classList.toggle("visible");
  }else{
    document.getElementById("panelLogin").classList.toggle("visible");
  }
}

function actualizarPanelAdmin(){
  const login=document.getElementById("panelLogin");
  const admin=document.getElementById("panelAdmin");
  if(usuarioActual){
    login.classList.remove("visible");
    admin.classList.add("visible");
  }else{
    admin.classList.remove("visible");
  }
}

async function cargarPeliculas(){
  const resultado=await supabaseClient.from("peliculas").select("*").order("created_at",{ascending:false});
  if(resultado.error){
    console.error(resultado.error);
    document.getElementById("peliculas").innerHTML='<div class="mensaje">❌ No se pudieron cargar las películas.</div>';
    return;
  }
  todasLasPeliculas=resultado.data||[];
  mostrarPeliculas();
}

function obtenerDatos(pelicula){
  try{
    if(pelicula.descripcion && typeof pelicula.descripcion==="string"){
      const datos=JSON.parse(pelicula.descripcion);
      return {
        anio:datos.anio||"",
        calidad:datos.calidad||"",
        tamano:datos.tamano||"",
        categoria:datos.categoria||"principal",
        texto:datos.texto||"",
        poster2:datos.poster2||""
      };
    }
  }catch(error){console.log("Descripción antigua");}
  return {anio:"",calidad:"",tamano:"",categoria:"principal",texto:pelicula.descripcion||"",poster2:""};
}

function cambiarCategoria(categoria,boton){
  categoriaActual=categoria;
  document.querySelectorAll(".categoria-btn").forEach(btn=>btn.classList.remove("activo"));
  boton.classList.add("activo");
  document.getElementById("buscador").value="";
  mostrarPeliculas();
}

function mostrarPeliculas(){
  const contenedor=document.getElementById("peliculas");
  const buscador=document.getElementById("buscador");
  let busqueda=(buscador.value||"").toLowerCase().trim();
  if(busqueda.includes("@")){buscador.value="";busqueda="";}
  const peliculas=todasLasPeliculas.filter(function(pelicula){
    const datos=obtenerDatos(pelicula);
    const categoria=datos.categoria||"principal";
    const textoBusqueda=((pelicula.titulo||"")+" "+(datos.texto||"")+" "+(datos.anio||"")+" "+categoria).toLowerCase();
    const coincideBusqueda=!busqueda||textoBusqueda.includes(busqueda);
    let coincideCategoria=true;
    if(categoriaActual==="mari"){
      coincideCategoria=pelicula.favorita_mari===true;
    }else if(categoriaActual!=="todas"){
      const normalizada=categoria==="familiares"?"familia":categoria;
      coincideCategoria=normalizada===categoriaActual;
    }
    return coincideBusqueda&&coincideCategoria;
  });
  if(!peliculas.length){
    contenedor.innerHTML='<div class="mensaje">🍿 No hay películas en esta sección.</div>';
    return;
  }
  contenedor.innerHTML=peliculas.map(pelicula=>{
    const indice=todasLasPeliculas.indexOf(pelicula);
    return crearTarjeta(pelicula,indice);
  }).join("");
}

function escaparHTML(valor){
  return String(valor??"").replace(/[&<>"']/g,caracter=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[caracter]);
}

function crearTarjeta(pelicula,indice){
  const datos=obtenerDatos(pelicula);
  const categoria=datos.categoria||"principal";
  let etiquetas="";
  if(datos.anio) etiquetas+=`<span class="etiqueta">${escaparHTML(datos.anio)}</span>`;
  if(datos.calidad) etiquetas+=`<span class="etiqueta">${escaparHTML(datos.calidad)}</span>`;
  if(datos.tamano) etiquetas+=`<span class="etiqueta">${escaparHTML(datos.tamano)}</span>`;
  if(categoria==="familia") etiquetas+='<span class="etiqueta">👨‍👩‍👧 Familia</span>';
  if(categoria==="terror") etiquetas+='<span class="etiqueta">👻 Terror</span>';
  if(categoria==="accion") etiquetas+='<span class="etiqueta">💥 Acción</span>';
  if(pelicula.favorita_mari===true) etiquetas+='<span class="etiqueta favorita">❤️ Mari</span>';

  const poster=pelicula.poster_url||"";
  const poster2=datos.poster2||"";
  const descripcion=datos.texto||"";
  const enlaceDescarga=convertirDropbox(pelicula.videos_url||"",true);
  const enlaceDropbox=pelicula.videos_url||"";
  const imagenHTML=poster
    ? `<img class="poster" src="${escaparHTML(poster)}" data-fallback="${escaparHTML(poster2)}" alt="${escaparHTML(pelicula.titulo||"Póster")}" onerror="reemplazarPoster(this)">`
    : (poster2
      ? `<img class="poster" src="${escaparHTML(poster2)}" alt="${escaparHTML(pelicula.titulo||"Póster")}" onerror="reemplazarPoster(this)">`
      : '<div class="poster poster-fallback">📷 Imagen no disponible</div>');

  return `
    <div class="tarjeta">
      ${imagenHTML}
      <div class="contenido">
        <div class="titulo">${escaparHTML(pelicula.titulo||"")}</div>
        <div class="etiquetas">${etiquetas}</div>
        <div class="descripcion">${escaparHTML(descripcion)}</div>
        <div class="botones">
          <button class="btn ver" onclick="verPeliculaPorIndice(${indice})" title="Reproductor de Apo1.reed">▶️ Ver 1</button>
          ${enlaceDropbox?`<a class="btn ver-dropbox" href="${escaparHTML(enlaceDropbox)}" target="_blank" rel="noopener" title="Abrir directamente desde Dropbox">☁️ Ver 2</a>`:""}
          ${enlaceDescarga?`<a class="btn descargar" href="${escaparHTML(enlaceDescarga)}" target="_blank" rel="noopener" download>⬇️ Descargar</a>`:""}
          <button class="btn" style="background:#147ef5;color:white" onclick="transmitirPeliculaPorIndice(${indice})">📺 TV</button>
          ${usuarioActual?`
            <button class="btn editar" onclick="editarPelicula('${escaparHTML(pelicula.id)}')">✏️ Editar</button>
            <button class="btn eliminar" onclick="eliminarPelicula('${escaparHTML(pelicula.id)}')">🗑️</button>
          `:""}
        </div>
      </div>
    </div>`;
}

function reemplazarPoster(img){
  const segunda=img.dataset.fallback||"";
  if(segunda && img.src!==segunda && !img.dataset.intento){
    img.dataset.intento="1";
    img.src=segunda;
    return;
  }
  const aviso=document.createElement("div");
  aviso.className="poster poster-fallback";
  aviso.textContent="📷 Imagen no disponible";
  img.replaceWith(aviso);
}

function convertirDropbox(url,descargar){
  if(!url) return "";
  try{
    const nuevaUrl=new URL(url.trim());
    if(descargar){
      nuevaUrl.searchParams.set("dl","1");
      nuevaUrl.searchParams.delete("raw");
    }else{
      nuevaUrl.searchParams.delete("dl");
      nuevaUrl.searchParams.set("raw","1");
    }
    return nuevaUrl.toString();
  }catch(error){
    console.error("Enlace Dropbox inválido:",error);
    return url.trim();
  }
}

function verPeliculaPorIndice(indice){
  const pelicula=todasLasPeliculas[indice];
  if(!pelicula) return;
  const enlaceOriginal=pelicula.videos_url||"";
  if(!enlaceOriginal){alert("Esta película no tiene un enlace de Dropbox.");return;}
  const urlVideo=convertirDropbox(enlaceOriginal,false);
  const video=document.getElementById("videoPlayer");
  const modal=document.getElementById("modal");
  const enlace=document.getElementById("abrirDropbox");
  modal.hidden=false;
  modal.classList.add("visible");
  video.pause();
  video.removeAttribute("src");
  video.load();
  video.setAttribute("type","video/mp4");
  video.src=urlVideo;
  enlace.href=enlaceOriginal;
  video.load();
  const iniciarReproduccion=()=>video.play().catch(error=>console.log("Autoplay bloqueado:",error));
  if(video.readyState>=2) iniciarReproduccion();
  else video.addEventListener("loadeddata",iniciarReproduccion,{once:true});
}

function cerrarVideo(){
  const video=document.getElementById("videoPlayer");
  const modal=document.getElementById("modal");
  if(!video) return;
  video.pause();
  video.removeAttribute("src");
  video.load();
  modal.classList.remove("visible");
  modal.hidden=true;
}

function limpiarFormulario(){
  document.getElementById("titulo").value="";
  document.getElementById("poster").value="";
  document.getElementById("poster2").value="";
  document.getElementById("enlace").value="";
  document.getElementById("anio").value="";
  document.getElementById("calidad").value="";
  document.getElementById("tamano").value="";
  document.getElementById("categoria").value="principal";
  document.getElementById("descripcion").value="";
  document.getElementById("favoritaMari").checked=false;
}

function cancelarEdicion(){
  peliculaEditandoId=null;
  limpiarFormulario();
  document.getElementById("tituloFormulario").textContent="🎬 Agregar película";
  document.getElementById("botonGuardar").textContent="➕ Agregar película";
  document.getElementById("botonGuardar").onclick=agregarPelicula;
  document.getElementById("botonCancelarEdicion").style.display="none";
  document.getElementById("mensajeAdmin").textContent="";
}

function editarPelicula(id){
  if(!usuarioActual){alert("Debes iniciar sesión.");return;}
  const pelicula=todasLasPeliculas.find(p=>String(p.id)===String(id));
  if(!pelicula){alert("No se encontró la película.");return;}
  const datos=obtenerDatos(pelicula);
  peliculaEditandoId=pelicula.id;
  document.getElementById("titulo").value=pelicula.titulo||"";
  document.getElementById("poster").value=pelicula.poster_url||"";
  document.getElementById("poster2").value=datos.poster2||"";
  document.getElementById("enlace").value=pelicula.videos_url||"";
  document.getElementById("anio").value=datos.anio||"";
  document.getElementById("calidad").value=datos.calidad||"";
  document.getElementById("tamano").value=datos.tamano||"";
  const categoria=datos.categoria||"principal";
  document.getElementById("categoria").value=categoria==="familiares"?"familia":categoria;
  document.getElementById("favoritaMari").checked=pelicula.favorita_mari===true;
  document.getElementById("descripcion").value=datos.texto||"";
  document.getElementById("tituloFormulario").textContent="✏️ Editar película";
  document.getElementById("botonGuardar").textContent="💾 Guardar cambios";
  document.getElementById("botonGuardar").onclick=guardarCambiosPelicula;
  document.getElementById("botonCancelarEdicion").style.display="inline-block";
  document.getElementById("mensajeAdmin").textContent="Editando: "+(pelicula.titulo||"Película");
  document.getElementById("panelAdmin").classList.add("visible");
  document.getElementById("panelAdmin").scrollIntoView({behavior:"smooth",block:"start"});
}

function obtenerFormulario(){
  return {
    titulo:document.getElementById("titulo").value.trim(),
    poster:document.getElementById("poster").value.trim(),
    poster2:document.getElementById("poster2").value.trim(),
    enlace:document.getElementById("enlace").value.trim(),
    anio:document.getElementById("anio").value.trim(),
    calidad:document.getElementById("calidad").value.trim(),
    tamano:document.getElementById("tamano").value.trim(),
    categoria:document.getElementById("categoria").value,
    favoritaMari:document.getElementById("favoritaMari").checked,
    descripcion:document.getElementById("descripcion").value.trim()
  };
}

function validarFormulario(datos){
  if(!datos.titulo||!datos.enlace){
    alert("Escribe al menos el título y el enlace de Dropbox.");
    return false;
  }
  return true;
}

function crearRegistro(datos){
  return {
    titulo:datos.titulo,
    descripcion:JSON.stringify({
      anio:datos.anio,
      calidad:datos.calidad,
      tamano:datos.tamano,
      categoria:datos.categoria,
      texto:datos.descripcion,
      poster2:datos.poster2
    }),
    poster_url:datos.poster,
    videos_url:datos.enlace,
    favorita_mari:datos.favoritaMari
  };
}

async function agregarPelicula(){
  if(!usuarioActual){alert("Debes iniciar sesión.");return;}
  const datos=obtenerFormulario();
  if(!validarFormulario(datos)) return;
  const boton=document.getElementById("botonGuardar");
  const mensaje=document.getElementById("mensajeAdmin");
  boton.disabled=true;
  boton.textContent="Agregando...";
  try{
    const resultado=await supabaseClient.from("peliculas").insert(crearRegistro(datos));
    if(resultado.error) throw resultado.error;
    mensaje.textContent="✅ Película agregada";
    limpiarFormulario();
    await cargarPeliculas();
  }catch(error){
    console.error("Error al agregar:",error);
    mensaje.textContent="❌ No se pudo agregar: "+error.message;
  }finally{
    boton.disabled=false;
    if(peliculaEditandoId===null) boton.textContent="➕ Agregar película";
  }
}

async function guardarCambiosPelicula(){
  if(!usuarioActual){alert("Debes iniciar sesión.");return;}
  if(peliculaEditandoId===null){alert("No hay ninguna película seleccionada para editar.");return;}
  const datos=obtenerFormulario();
  if(!validarFormulario(datos)) return;

  const id=peliculaEditandoId;
  const boton=document.getElementById("botonGuardar");
  const mensaje=document.getElementById("mensajeAdmin");
  boton.disabled=true;
  boton.textContent="Guardando...";

  try{
    const resultado=await supabaseClient
      .from("peliculas")
      .update(crearRegistro(datos))
      .eq("id",id)
      .select("id")
      .maybeSingle();

    if(resultado.error) throw resultado.error;
    if(!resultado.data){
      throw new Error("Supabase no confirmó la actualización. Comprueba que el ID exista y que las políticas RLS permitan actualizar y leer ese registro.");
    }

    mensaje.textContent="✅ ¡Cambios guardados correctamente!";
    peliculaEditandoId=null;
    limpiarFormulario();
    document.getElementById("tituloFormulario").textContent="🎬 Agregar película";
    boton.textContent="➕ Agregar película";
    boton.onclick=agregarPelicula;
    document.getElementById("botonCancelarEdicion").style.display="none";
    await cargarPeliculas();
  }catch(error){
    console.error("Error al guardar:",error);
    mensaje.textContent="❌ No se guardaron los cambios: "+(error.message||String(error));
  }finally{
    boton.disabled=false;
    if(peliculaEditandoId!==null) boton.textContent="💾 Guardar cambios";
  }
}

async function eliminarPelicula(id){
  if(!usuarioActual){alert("Debes iniciar sesión.");return;}
  if(!confirm("¿Quieres eliminar esta película?")) return;
  const resultado=await supabaseClient.from("peliculas").delete().eq("id",id);
  if(resultado.error){alert("❌ "+resultado.error.message);return;}
  if(String(peliculaEditandoId)===String(id)) cancelarEdicion();
  await cargarPeliculas();
}

/* GOOGLE CAST */
async function transmitirPeliculaPorIndice(indice){
  if(castEnviando) return;
  const pelicula=todasLasPeliculas[indice];
  if(!pelicula) return;
  const enlaceOriginal=pelicula.videos_url||"";
  if(!enlaceOriginal){alert("Esta película no tiene un enlace de Dropbox.");return;}

  castEnviando=true;
  try{
    if(!googleCastInicializado && !inicializarGoogleCast()){
      alert("Google Cast todavía no está listo. Espera unos segundos y vuelve a pulsar TV.");
      return;
    }
    const context=cast.framework.CastContext.getInstance();
    let session=context.getCurrentSession();

    if(!session){
      try{
        await context.requestSession();
      }catch(error){
        console.error("No se pudo iniciar la sesión de Google Cast:",error);
        alert("No se pudo conectar con la TV. Comprueba que esté encendida, en la misma red y que Google Cast esté disponible.");
        return;
      }
      session=context.getCurrentSession();
    }

    if(!session){
      alert("La sesión de Google Cast no se inició. Vuelve a pulsar TV.");
      return;
    }

    const urlVideo=convertirDropbox(enlaceOriginal,false);
    const mediaInfo=new chrome.cast.media.MediaInfo(urlVideo,"video/mp4");
    mediaInfo.streamType=chrome.cast.media.StreamType.BUFFERED;
    mediaInfo.metadata=new chrome.cast.media.GenericMediaMetadata();
    mediaInfo.metadata.title=pelicula.titulo||"Película";
    if(pelicula.poster_url){
      mediaInfo.metadata.images=[new chrome.cast.Image(pelicula.poster_url)];
    }
    const request=new chrome.cast.media.LoadRequest(mediaInfo);
    request.autoplay=true;
    request.currentTime=0;

    await session.loadMedia(request);
    console.log("Película enviada correctamente por Google Cast.");
  }catch(error){
    console.error("Error al enviar por Google Cast:",error);
    alert("La TV se conectó, pero no se pudo iniciar la película. Puede ser un problema de formato o del enlace de Dropbox. Revisa la consola para ver el error.");
  }finally{
    castEnviando=false;
  }
}
